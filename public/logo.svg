<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- تدرج اللهب الأخضر الزمردي الفوسفوري -->
    <linearGradient id="flameGreen" x1="60" y1="16" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- تدرج الإطار المتوهج -->
    <linearGradient id="borderGlow" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.7" />
    </linearGradient>

    <!-- فلتر التوهج النيون -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- الخلفية الداكنة ذات الحواف الدائرية -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#070a13" stroke="url(#borderGlow)" stroke-width="2.5" />

  <!-- حرف A الهندسي بأطراف سفلية مسحوبة كاللهب -->
  <g filter="url(#neonGlow)">
    <!-- الجزء العلوي من حرف A -->
    <path
      d="M60 18 L43 58 L54 54 L60 39 L68 58 L79 58 L60 18 Z"
      fill="url(#flameGreen)"
    />

    <!-- العارضة المائلة والساق اليسرى المسحوبة كاللهب -->
    <path
      d="M73 53 L39 66 C34 78 26 91 21 104 C29 98 35 92 38 97 C40 90 45 84 49 74 L76 62 L73 53 Z"
      fill="url(#flameGreen)"
    />

    <!-- الساق اليمنى المسحوبة كاللهب -->
    <path
      d="M71 66 L81 66 C86 78 94 91 99 104 C91 98 85 92 82 97 C80 90 75 84 71 66 Z"
      fill="url(#flameGreen)"
    />
  </g>
</svg>
